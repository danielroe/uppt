name: 'uppt/pr'
description: 'Parse conventional commits since the last tag and open or update a draft release PR.'
author: 'Daniel Roe'

branding:
  icon: 'git-pull-request'
  color: 'black'

inputs:
  token:
    description: 'GitHub token. Needs `contents: write` and `pull-requests: write`.'
    required: false
    default: ${{ github.token }}
  base-branch:
    description: 'Branch the release PR is opened against.'
    required: false
    default: ${{ github.event.repository.default_branch }}
  node-version:
    description: 'Node version for the scripts. Needs `--experimental-strip-types` support (22.6+, 24+ recommended).'
    required: false
    default: '24'
  checkout:
    description: 'Whether the action should run `actions/checkout` itself. Set to `false` if the caller has already checked out with `fetch-depth: 0`.'
    required: false
    default: 'true'
  packages:
    description: 'Newline-separated list of publishable workspace directories, relative to the repo root. Each line is a path or glob (e.g. `packages/*`); `!`-prefixed entries are excluded; workspaces with `"private": true` are skipped. Omit for single-package repos.'
    required: false
    default: ''
  prerelease:
    description: 'One-shot prerelease identifier (e.g. `beta`, `rc`, or a bare number like `0`). When set, this run cuts or continues a prerelease: from a stable version the normal bump is applied and the identifier attached at counter 0 (`4.5.2` → `5.0.0-beta.0`); from a prerelease with the same identifier the counter increments (`5.0.0-beta.0` → `5.0.0-beta.1`). Omit for normal releases; a prerelease version with this unset graduates to its stable version.'
    required: false
    default: ''
  allow-forks:
    description: 'Whether to run when the repository is a fork. Defaults to `false` so a fork of a repo using uppt does not open release PRs of its own.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate event
      id: guard
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK: ${{ github.event.repository.fork }}
        ALLOW_FORKS: ${{ inputs.allow-forks }}
      run: |
        set -euo pipefail
        if [ "$IS_FORK" = "true" ] && [ "$ALLOW_FORKS" != "true" ]; then
          echo "::notice::danielroe/uppt/pr skipped: ${GITHUB_REPOSITORY:-this repository} is a fork. Set 'allow-forks: true' to cut releases from a fork."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$EVENT_NAME" != "push" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
          echo "::error::danielroe/uppt/pr only supports 'push' and 'workflow_dispatch' events, got '$EVENT_NAME'."
          exit 1
        fi

    - name: Checkout
      if: steps.guard.outputs.skip != 'true' && inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ inputs.token }}
        persist-credentials: false

    - name: Setup Node
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Update changelog and open/update release PR
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        RELEASE_BASE: ${{ inputs.base-branch }}
        PACKAGES: ${{ inputs.packages }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: node --experimental-strip-types ${{ github.action_path }}/../scripts/update-changelog.ts
