name: pin-readme

# After a release tag lands, rewrite the `uses: danielroe/uppt/*@<ref>`
# lines in README.md to pin to the new tag's SHA and commit straight
# to main. See scripts/pin-readme.ts for the rewrite logic.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pin-readme
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the README update directly to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pin README and push to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pin-readme.ts
