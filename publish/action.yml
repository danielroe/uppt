name: 'uppt/publish'
description: 'Stage-publish a prebuilt tarball to npm using OIDC trusted publishing.'
author: 'Daniel Roe'

branding:
  icon: 'package'
  color: 'black'

inputs:
  node-version:
    description: 'Node version for the scripts and for `npm stage publish`. Needs `--experimental-strip-types` support (22.6+, 24+ recommended).'
    required: false
    default: '24'
  npm-access:
    description: 'npm access level (`public` or `restricted`).'
    required: false
    default: 'public'
  npm-tag:
    description: 'Optional npm dist-tag override applied to every tarball. By default the tag is derived from each tarball''s version: stable versions publish to `latest`, prereleases to their identifier (`5.0.0-beta.0` → `beta`, `5.0.0-rc.1` → `rc`), and prereleases with a bare numeric identifier (`5.0.0-0`) to `next`. Required when a tarball filename carries no parseable version, since uppt refuses to guess.'
    required: false
    default: ''
  files:
    description: 'Optional JSON array of tarball filenames to publish, as emitted by `uppt/pack`''s `files` output. When omitted, the action publishes every `*.tgz` it finds in the downloaded artifact.'
    required: false
    default: ''
  releases:
    description: 'Independent-mode publish payload: the ordered JSON array of `{ name, version, dir }` entries emitted by `uppt/release` and delivered via the workflow''s `releases` dispatch input. Never set by hand. When present, the run must be on the matching `release-YYYY-MM-DD` coordination tag, and (when `files` is omitted) tarballs are staged in the payload''s topological order.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate event
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASES: ${{ inputs.releases }}
      run: |
        set -euo pipefail
        case "$EVENT_NAME" in
          push|workflow_dispatch) ;;
          *)
            echo "::error::danielroe/uppt/publish only supports 'push' and 'workflow_dispatch' events, got '$EVENT_NAME'."
            exit 1
            ;;
        esac
        if [ -n "${RELEASES:-}" ]; then
          if ! printf '%s' "${GITHUB_REF:-}" | grep -Eq '^refs/tags/release-[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::danielroe/uppt/publish got a 'releases' payload but the ref is not a 'refs/tags/release-YYYY-MM-DD' coordination tag (got '${GITHUB_REF:-<unset>}')."
            exit 1
          fi
        elif [ "${GITHUB_REF:-}" = "${GITHUB_REF#refs/tags/v}" ]; then
          echo "::error::danielroe/uppt/publish expected a 'refs/tags/v*' ref, got '${GITHUB_REF:-<unset>}'."
          exit 1
        fi

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Update npm
      shell: bash
      run: npm install -g npm@latest

    - name: Download tarball artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: uppt-tarball
        path: ${{ runner.temp }}/uppt-tarballs

    - name: Publish to npm
      shell: bash
      env:
        NPM_ACCESS: ${{ inputs.npm-access }}
        NPM_TAG: ${{ inputs.npm-tag }}
        TARBALL_DIR: ${{ runner.temp }}/uppt-tarballs
        TARBALL_FILES: ${{ inputs.files }}
        RELEASES: ${{ inputs.releases }}
      run: node --experimental-strip-types ${{ github.action_path }}/../scripts/publish.ts
